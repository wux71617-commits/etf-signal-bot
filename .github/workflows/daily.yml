name: ETF Signal Bot

on:
  schedule:
    - cron: "0 13 * * *"   # 每天自动运行（UTC时间）
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run strategy
        run: python run.py
